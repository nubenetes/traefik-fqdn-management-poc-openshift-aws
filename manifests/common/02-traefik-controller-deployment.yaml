# ==============================================================================
# Enterprise Red Hat OpenShift (v4.14+) / AWS (ROSA) Deployment
# Repository: https://github.com/nubenetes/traefik-fqdn-management-poc-openshift-aws
# Context: ://github.com/nubenetes/traefik-fqdn-management-poc-openshift-aws
#
# File: manifests/common/02-traefik-controller-deployment.yaml
# Description:
#   Production Traefik Proxy v3.0+ Deployment and AWS NLB LoadBalancer Service.
#   Pre-configured with concurrent support for both Traefik CRDs (Solution A)
#   and Kubernetes Gateway API v1 (Solution B).
#   Strictly adheres to Red Hat OpenShift v4.14+ 'restricted-v2' SCC (non-root UID 65532,
#   read-only rootfs, unprivileged ports 8000/8443).
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-ingress-controller
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-enterprise
    spec:
      serviceAccountName: traefik-ingress-controller
      terminationGracePeriodSeconds: 60
      # OpenShift 4.14+ restricted-v2 SCC Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: docker.io/library/traefik:v3.1.2
          imagePullPolicy: IfNotPresent
          args:
            # Global Configuration
            - "--global.checknewversion=false"
            - "--global.sendanonymoususage=false"

            # EntryPoints (Unprivileged ports complying with OpenShift SCC)
            - "--entrypoints.web.address=:8000"
            - "--entrypoints.websecure.address=:8443"
            - "--entrypoints.traefik.address=:9000"

            # Proxy Protocol v2 configuration for AWS NLB real IP preservation
            - "--entrypoints.web.proxyProtocol.trustedIPs=10.0.0.0/16,10.128.0.0/14"
            - "--entrypoints.websecure.proxyProtocol.trustedIPs=10.0.0.0/16,10.128.0.0/14"
            - "--entrypoints.web.forwardedHeaders.trustedIPs=10.0.0.0/16,10.128.0.0/14"
            - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.0.0.0/16,10.128.0.0/14"

            # Solution A: Traefik Custom Resource Definitions (CRD) Provider
            - "--providers.kubernetescrd=true"
            - "--providers.kubernetescrd.allowcrossnamespace=true"
            - "--providers.kubernetescrd.namespaces=traefik-system,traefik-crd-poc"

            # Solution B: Standard Kubernetes Gateway API Provider
            - "--providers.kubernetesgateway=true"
            - "--providers.kubernetesgateway.experimentalchannel=false"

            # Health Check & Observability
            - "--ping=true"
            - "--ping.entrypoint=traefik"
            - "--metrics.prometheus=true"
            - "--metrics.prometheus.entrypoint=traefik"
            - "--accesslog=true"
            - "--accesslog.format=json"
            - "--log.level=INFO"
          ports:
            - name: web
              containerPort: 8000
              protocol: TCP
            - name: websecure
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 9000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
---
# ------------------------------------------------------------------------------
# AWS Network Load Balancer (NLB) Service for Traefik Controller
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: traefik-loadbalancer
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: traefik
  annotations:
    # AWS Load Balancer Controller NLB Integration
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: "*"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # ExternalDNS synchronization for root domain and wildcard
    external-dns.alpha.kubernetes.io/hostname: "company.com,api.company.com"
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 8443
      protocol: TCP
